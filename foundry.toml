[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
memory_limit = 4294967296
gas_limit = 9223372036854775807

optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

fs_permissions = [{ access = "read-write", path = "./deployments" }]
